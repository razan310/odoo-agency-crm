; Odoo server configuration (template).
;
; ${VAR} placeholders are filled from environment variables when the
; container starts (see odoo/scripts/entrypoint.sh), so no secret is
; stored in git. The rendered file lives at /etc/odoo/odoo.conf inside
; the container.

[options]
; Where Odoo looks for modules. /mnt/extra-addons is ./odoo/addons on the
; host. Odoo's standard addons (crm, sale, ...) are always added on top.
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Master password: protects the database manager (/web/database/manager),
; i.e. creating, duplicating, backing up, restoring and dropping databases.
; It is NOT the password used to log in to Odoo.
admin_passwd = ${ODOO_MASTER_PASSWORD}

; PostgreSQL connection: the "db" service from docker-compose.yml.
db_host = db
db_port = 5432
db_user = ${POSTGRES_USER}
db_password = ${POSTGRES_PASSWORD}

; Only expose our database over HTTP, so the login page skips the
; database selector.
dbfilter = ^${ODOO_DB}$

; Development settings. For production: list_db = False, workers > 0,
; proxy_mode = True behind a reverse proxy, and a real SMTP server.
list_db = True
workers = 0
log_level = info
